modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mixins]]
config="ars_qol.mixins.json"

[[mods]]
modId="${mod_id}"
logoFile="icon.png"
version="${mod_version}"
displayName="${mod_name}"
authors="Akuro Studio"
description='''
Quality of life additions for Ars Nouveau: curios spellbook casting and dyeable books.
'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="ars_nouveau"
type="required"
versionRange="[5.13.0,)"
ordering="AFTER"
side="BOTH"


[[dependencies.${mod_id}]]
modId="curios"
type="required"
ordering="AFTER"
side="BOTH"
versionRange="[9.0.0,)"
